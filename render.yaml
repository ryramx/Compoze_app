# Blueprint do Render: ambiente de staging do Compoze.
# Sem `projects:` de propósito: o plano Hobby limita projetos, e um Blueprint
# com projeto novo não é aceito numa conta que já tem um.
# O banco fica fora do Render, no Neon (grátis); só API e front são criados aqui.
# Como usar: Render → New → Blueprint → escolher este repositório.
# Guia: docs/backend/deploy.md

services:
  - type: web
    name: compoze-api-staging
    runtime: node
    region: virginia
    plan: free
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    # As migrações rodam na subida (apps/api/src/servidor.ts).
    startCommand: pnpm --filter @compoze/api start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - render.yaml
      ignoredPaths:
        - "**/*.md"
        - "**/test/**"
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Banco no Neon (plano grátis, PostgreSQL 18). O Render pede o valor na
      # criação do Blueprint: use a connection string *direta* (sem "-pooler"),
      # com ?sslmode=require. Ver docs/backend/deploy.md.
      - key: DATABASE_URL
        sync: false
      # Gerado pelo Render na criação; nunca fica no repositório (ADR 0006).
      - key: JWT_SECRET
        generateValue: true
      # URL pública do front de staging (abaixo).
      - key: CORS_ORIGINS
        value: https://compoze-web-staging.onrender.com

  - type: web
    name: compoze-web-staging
    runtime: static
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @compoze/web build
    staticPublishPath: apps/web/dist
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/web/**
        - package.json
        - pnpm-lock.yaml
        - render.yaml
      ignoredPaths:
        - "**/*.md"
    routes:
      # SPA: toda rota cai no index.html e o React Router resolve.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "24"
      # A API de staging. Para apresentar sem backend, troque por "demo".
      - key: VITE_API_URL
        value: https://compoze-api-staging.onrender.com
